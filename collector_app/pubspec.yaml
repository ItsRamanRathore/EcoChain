name: collector_app
description: "E-Waste Informal Collector Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Networking
  dio: ^5.4.0
  connectivity_plus: ^6.1.4
  
  # Local Storage & Queue
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  
  # Routing
  go_router: ^12.1.1
  
  # Location & Hardware
  geolocator: ^13.0.2
  google_mlkit_barcode_scanning: ^0.13.0
  permission_handler: ^11.3.1
  
  # UI & Accessibility
  flutter_svg: ^2.0.9
  intl: ^0.20.3
  flutter_tts: ^4.0.2
  tflite_flutter: ^0.12.1
  image: ^4.1.4
  image_picker: ^1.1.2
  uuid: ^4.4.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/ml/material_classifier.tflite
    - assets/ml/labels.txt
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
